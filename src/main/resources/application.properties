spring.datasource.url=jdbc:postgresql://localhost:5432/bloodmatcher
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.donation.cooldown-days=90
# Scheduler scan interval in milliseconds; escalation delays in seconds.
app.escalation.enabled=true
app.escalation.scan-delay-ms=60000
app.escalation.critical-delay-seconds=600
app.escalation.urgent-delay-seconds=1800
app.escalation.normal-delay-seconds=7200
